<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JACkaL UW Capstone Team</title>
    <meta name="description" content="A UW capstone team that defines the product, learns from users, designs every screen, and ships it in code." />
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- TODO: confirm the exact family from the team's Figma file. Figtree is the closest match to the screenshots. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..800;1,300..800&display=swap" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="#top" aria-label="JACkaL, back to top">
        <img src="/logo.png" alt="" width="58" height="80" />
        <span class="site-logo__word" aria-hidden="true"><span class="site-logo__caps">JAC</span>ka<span class="site-logo__caps">L</span></span>
      </a>
      <div class="site-actions">
        <nav class="site-nav" id="site-nav" aria-label="Main">
          <ul class="site-nav__list" data-nav></ul>
        </nav>
        <a class="site-sponsor" href="mailto:athanc@uw.edu,c4nnkayy@uw.edu,hchang42@uw.edu,jserra2@uw.edu?subject=Sponsorship%20Inquiry">Sponsor Us</a>
        <button class="site-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-nav" data-menu-btn>
          <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path class="bar-top" d="M3 5h14" /><path class="bar-mid" d="M3 10h14" /><path class="bar-bottom" d="M3 15h14" /></svg>
        </button>
      </div>
    </header>

    <main id="top">
      <section class="hero" aria-label="Introduction">
        <canvas class="hero__grid" aria-hidden="true" data-grid></canvas>
        <div class="hero__inner">
          <div class="hero__text" data-hero-text>
            <h1 class="hero__tagline" data-tagline></h1>
            <p class="hero__badge">University of Washington · Capstone 2026–27</p>
          </div>
        </div>
        <aside class="pack" aria-labelledby="pack-title" data-pack>
          <div class="pack__box">
            <div class="pack__head">
              <h2 class="pack__title" id="pack-title">Meet the Pack</h2>
              <button class="pack__toggle" type="button" aria-label="Minimize team card" aria-expanded="true" aria-controls="pack-body" data-pack-toggle>
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path class="pack__toggle-h" d="M2 8h12" /><path class="pack__toggle-v" d="M8 2v12" /></svg>
              </button>
            </div>
            <div class="pack__body" id="pack-body">
              <ul class="pack__team" data-pack-team></ul>
              <a class="pack__more" data-pack-more>Learn More <span aria-hidden="true">→</span></a>
            </div>
          </div>
          <span class="pack__handle pack__handle--tl" aria-hidden="true"></span>
          <span class="pack__handle pack__handle--tr" aria-hidden="true"></span>
          <span class="pack__handle pack__handle--bl" aria-hidden="true"></span>
          <span class="pack__handle pack__handle--br" aria-hidden="true"></span>
        </aside>
      </section>

      <section class="projects" id="projects" aria-labelledby="projects-heading">
        <h2 class="visually-hidden" id="projects-heading">Projects</h2>
        <div class="projects__filters" role="group" aria-label="Filter projects by discipline" data-filters></div>
        <div class="projects__stage" data-stage>
          <ul class="projects__list" data-list></ul>
          <p class="projects__empty" data-empty hidden>No projects in this category yet.</p>
          <div class="pcard" data-card role="button" tabindex="0">
            <div class="pcard__inner" data-card-inner></div>
          </div>
          <svg class="connector" aria-hidden="true" data-connector>
            <path class="connector__path" />
            <circle class="connector__dot" r="5" />
            <circle class="connector__dot" r="5" />
          </svg>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="contact">
      <h2 class="site-footer__heading" data-footer-heading></h2>
      <ul class="site-footer__emails" data-emails></ul>
    </footer>

    <dialog class="modal" data-modal>
      <div class="modal__panel" data-modal-panel>
        <div class="modal__bar">
          <button class="modal__close" type="button" aria-label="Close project" data-modal-close autofocus>
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
          </button>
        </div>
        <article class="cs" data-modal-content></article>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
