<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Capstone Team Portfolio</title>
    <meta name="description" content="A UW capstone team that defines the product, learns from users, designs every screen, and ships it in code." />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- TODO: confirm the exact family from the team's Figma file. Figtree is the closest match to the screenshots. -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..800;1,300..800&display=swap" />
  </head>
  <body>
    <header class="site-header">
      <a class="site-logo" href="#top" aria-label="Back to top">
        <img src="/logo.svg" alt="" width="58" height="80" />
      </a>
      <nav class="site-nav" aria-label="Main">
        <ul class="site-nav__list" data-nav></ul>
      </nav>
    </header>

    <main id="top">
      <section class="hero" aria-label="Introduction">
        <canvas class="hero__grid" aria-hidden="true" data-grid></canvas>
        <div class="hero__inner">
          <h1 class="hero__tagline" data-tagline></h1>
        </div>
      </section>

      <section class="projects" id="projects" aria-labelledby="projects-heading">
        <h2 class="visually-hidden" id="projects-heading">Projects</h2>
        <div class="projects__filters" role="group" aria-label="Filter projects by discipline" data-filters></div>
        <div class="projects__stage" data-stage>
          <ul class="projects__list" data-list></ul>
          <p class="projects__empty" data-empty hidden>No projects in this category yet.</p>
          <div class="pcard" data-card role="button" tabindex="0">
            <div class="pcard__inner" data-card-inner></div>
          </div>
          <svg class="connector" aria-hidden="true" data-connector>
            <path class="connector__path" />
            <circle class="connector__dot" r="5" />
            <circle class="connector__dot" r="5" />
          </svg>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="contact">
      <h2 class="site-footer__heading" data-footer-heading></h2>
      <ul class="site-footer__emails" data-emails></ul>
    </footer>

    <dialog class="modal" data-modal>
      <div class="modal__panel" data-modal-panel>
        <div class="modal__bar">
          <button class="modal__close" type="button" aria-label="Close project" data-modal-close autofocus>
            <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" /></svg>
          </button>
        </div>
        <article class="cs" data-modal-content></article>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
